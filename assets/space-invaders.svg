          <rect x="0" y="8" width="24" height="4"/><rect x="4" y="12" width="4" height="4"/>
          <rect x="16" y="12" width="4" height="4"/><rect x="8" y="16" width="8" height="4"/>
        </g>
        <g class="fb">
          <rect x="8" y="0" width="8" height="4"/><rect x="4" y="4" width="16" height="4"/>
          <rect x="0" y="8" width="24" height="4"/><rect x="0" y="12" width="4" height="4"/>
          <rect x="20" y="12" width="4" height="4"/><rect x="4" y="16" width="4" height="4"/>
          <rect x="16" y="16" width="4" height="4"/>
        </g>
      </g>
      <g transform="translate(320, 45)">
