<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <style>
    @keyframes march {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(30px); }
    }
    @keyframes frameA {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes frameB {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
    @keyframes shipMove {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(60px); }
      75% { transform: translateX(-60px); }
    }
    @keyframes bullet {
      0% { transform: translateY(0); opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-120px); opacity: 0; }
    }
    @keyframes explosion {
      0%, 70% { opacity: 0; }
      75%, 85% { opacity: 1; }
      90%, 100% { opacity: 0; }
    }
    @keyframes shieldHit {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.6; }
    }
    .invaders { animation: march 2s steps(2) infinite; }
    .fa { animation: frameA 1s steps(1) infinite; }
    .fb { animation: frameB 1s steps(1) infinite; }
    .ship { animation: shipMove 4s ease-in-out infinite; }
    .bullet1 { animation: bullet 1.2s linear infinite; }
    .bullet2 { animation: bullet 1.2s linear infinite 0.6s; }
    .boom { animation: explosion 4s linear infinite; }
    .px { shape-rendering: crispEdges; }
    .hud { font-family: 'Courier New', monospace; font-size: 13px; fill: #3fb950; font-weight: bold; }
  </style>

  <!-- background -->
  <rect width="800" height="220" fill="#0d1117"/>

  <!-- stars -->
  <g fill="#c9d1d9" opacity="0.4">
    <rect x="60" y="50" width="2" height="2"/>
    <rect x="180" y="90" width="2" height="2"/>
    <rect x="350" y="40" width="2" height="2"/>
    <rect x="550" y="70" width="2" height="2"/>
    <rect x="700" y="45" width="2" height="2"/>
    <rect x="450" y="100" width="2" height="2"/>
    <rect x="120" y="130" width="2" height="2"/>
    <rect x="650" y="120" width="2" height="2"/>
  </g>

  <!-- HUD -->
  <text class="hud" x="20" y="22">SCORE&lt;1&gt;  01580</text>
  <text class="hud" x="350" y="22">HI-SCORE  08800</text>
  <text class="hud" x="660" y="22">LIVES 3</text>

  <!-- invader rows -->
  <g class="invaders px">
