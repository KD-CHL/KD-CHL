  <!-- explosion near an invader -->
  <g class="boom px" fill="#ffe600" transform="translate(530, 80)">
    <rect x="8" y="0" width="4" height="4"/><rect x="0" y="8" width="4" height="4"/>
    <rect x="16" y="8" width="4" height="4"/><rect x="8" y="16" width="4" height="4"/>
    <rect x="6" y="6" width="8" height="8" fill="#f0883e"/>
  </g>

  <!-- player ship -->
