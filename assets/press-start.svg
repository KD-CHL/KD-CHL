<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="100%" stop-color="#150535"/>
    </linearGradient>
    <filter id="glow-pink">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 55% { opacity: 1; }
      56%, 100% { opacity: 0.1; }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.6; }
      94% { opacity: 1; }
      97% { opacity: 0.8; }
      98% { opacity: 1; }
    }
    @keyframes scan {
      0% { transform: translateY(-200px); }
      100% { transform: translateY(200px); }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.2; }
    }
    .press-start {
      font-family: 'Courier New', monospace;
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 12px;
      fill: #ff2d95;
      animation: blink 1.2s steps(1) infinite, flicker 4s linear infinite;
    }
    .title {
      font-family: 'Courier New', monospace;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 6px;
      fill: #00f0ff;
    }
    .coin {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      letter-spacing: 4px;
      fill: #ffe600;
      animation: blink 0.8s steps(1) infinite;
    }
    .scanline {
      animation: scan 3s linear infinite;
    }
    .star { animation: starTwinkle 2s ease-in-out infinite; }
    .star2 { animation: starTwinkle 2.6s ease-in-out infinite 0.5s; }
    .star3 { animation: starTwinkle 1.8s ease-in-out infinite 1s; }
  </style>

  <!-- background -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- grid floor -->
  <g stroke="#ff2d95" stroke-width="1" opacity="0.35">
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="172" x2="800" y2="172"/>
    <line x1="0" y1="186" x2="800" y2="186"/>
    <line x1="400" y1="155" x2="0" y2="200"/>
    <line x1="400" y1="155" x2="130" y2="200"/>
    <line x1="400" y1="155" x2="265" y2="200"/>
    <line x1="400" y1="155" x2="400" y2="200"/>
    <line x1="400" y1="155" x2="535" y2="200"/>
    <line x1="400" y1="155" x2="670" y2="200"/>
    <line x1="400" y1="155" x2="800" y2="200"/>
  </g>

  <!-- stars -->
  <circle class="star" cx="80" cy="30" r="2" fill="#fff"/>
  <circle class="star2" cx="200" cy="55" r="1.5" fill="#00f0ff"/>
  <circle class="star3" cx="340" cy="25" r="2" fill="#fff"/>
  <circle class="star" cx="520" cy="45" r="1.5" fill="#ff2d95"/>
  <circle class="star2" cx="650" cy="28" r="2" fill="#fff"/>
  <circle class="star3" cx="740" cy="60" r="1.5" fill="#00f0ff"/>
  <circle class="star" cx="120" cy="80" r="1" fill="#fff"/>
  <circle class="star2" cx="600" cy="85" r="1" fill="#ffe600"/>

  <!-- title -->
  <text class="title" x="400" y="60" text-anchor="middle" filter="url(#glow-cyan)">KD-CHL ARCADE</text>

  <!-- press start -->
  <text class="press-start" x="400" y="118" text-anchor="middle" filter="url(#glow-pink)">PRESS START</text>

  <!-- insert coin -->
  <text class="coin" x="400" y="148" text-anchor="middle">INSERT COIN TO CONTINUE</text>

  <!-- CRT scanline effect -->
  <rect class="scanline" x="0" y="0" width="800" height="40" fill="#ffffff" opacity="0.03"/>

  <!-- CRT vignette lines -->
  <g opacity="0.06">
    <rect x="0" y="0" width="800" height="1" fill="#fff"/>
    <rect x="0" y="4" width="800" height="1" fill="#fff"/>
    <rect x="0" y="8" width="800" height="1" fill="#fff"/>
  </g>
</svg>
